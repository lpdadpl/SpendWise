spring:
  application:
    name: SpendwiseBack

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:never}

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Spendwise}
    username: ${SPRING_DATASOURCE_USERNAME:spendwise}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database: postgresql
    show-sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SIGNING_KEY}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
