<div class="min-h-screen bg-gray-50">
    <app-navbar></app-navbar>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-8 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Crear Nueva Plantilla</h1>
                <p class="text-gray-600">
                    Diseña un presupuesto personalizado para gestionar tus gastos
                </p>
            </div>
            <a routerLink="/dashboard"
                class="flex items-center gap-2 px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg transition-all transform hover:scale-105 hover:text-blue-600 hover:border-blue-300 hover:shadow-md cursor-pointer">
                <i class="pi pi-arrow-left"></i>
                <span>Volver al Dashboard</span>
            </a>
        </div>

        <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-lg flex items-start gap-3">
            <lucide-icon name="alert-circle" class="w-5 h-5 text-amber-600 flex-shrink-0 mt-0.5"></lucide-icon>
            <p class="text-amber-800">{{ error || 'Funcionalidad de creación de plantillas en desarrollo' }}</p>
        </div>

        <form (ngSubmit)="handleSubmit()" class="space-y-6">
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <h2 class="text-gray-900 mb-4 font-bold text-xl">Información Básica</h2>

                <div class="space-y-4">
                    <div>
                        <label htmlFor="name" class="block text-gray-700 mb-2">
                            Nombre de la Plantilla *
                        </label>
                        <input id="name" type="text" [(ngModel)]="name" name="name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Ej: Presupuesto Mensual Personal" disabled />
                    </div>

                    <div>
                        <label htmlFor="description" class="block text-gray-700 mb-2">
                            Descripción *
                        </label>
                        <textarea id="description" [(ngModel)]="description" name="description" rows="3"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Describe el propósito de esta plantilla..." disabled></textarea>
                    </div>
                </div>
            </div>

            <div class="flex gap-4">
                <button type="button" (click)="navigateBack()"
                    class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Volver al Dashboard
                </button>
            </div>
        </form>
    </div>
</div>
