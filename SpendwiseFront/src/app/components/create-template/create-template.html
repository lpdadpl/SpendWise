<div class="min-h-screen bg-gray-50">
    <app-navbar></app-navbar>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Crear Nueva Plantilla</h1>
            <p class="text-gray-600">
                Diseña un presupuesto personalizado para gestionar tus gastos
            </p>
        </div>

        <!-- Success Message -->
        <div *ngIf="success" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg flex items-start gap-3">
            <lucide-icon name="check-circle" class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5"></lucide-icon>
            <div>
                <p class="text-green-800">¡Plantilla creada exitosamente!</p>
                <p class="text-green-700 text-sm mt-1">Redirigiendo...</p>
            </div>
        </div>

        <!-- Error Message -->
        <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg flex items-start gap-3">
            <lucide-icon name="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></lucide-icon>
            <p class="text-red-800">{{ error }}</p>
        </div>

        <form (ngSubmit)="handleSubmit()" class="space-y-6">
            <!-- Basic Info -->
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <h2 class="text-gray-900 mb-4 font-bold text-xl">Información Básica</h2>

                <div class="space-y-4">
                    <div>
                        <label htmlFor="name" class="block text-gray-700 mb-2">
                            Nombre de la Plantilla *
                        </label>
                        <input id="name" type="text" [(ngModel)]="name" name="name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Ej: Presupuesto Mensual Personal" [disabled]="isLoading || success" />
                    </div>

                    <div>
                        <label htmlFor="description" class="block text-gray-700 mb-2">
                            Descripción *
                        </label>
                        <textarea id="description" [(ngModel)]="description" name="description" rows="3"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Describe el propósito de esta plantilla..."
                            [disabled]="isLoading || success"></textarea>
                    </div>
                </div>
            </div>

            <!-- Categories -->
            <div class="bg-white rounded-xl p-6 shadow-sm">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-gray-900 font-bold text-xl">Categorías de Gastos</h2>
                    <button type="button" (click)="addCategory()" [disabled]="isLoading || success"
                        class="flex items-center gap-2 px-4 py-2 text-white rounded-lg transition-all hover:opacity-90 disabled:bg-gray-400"
                        style="background-color: var(--color-primary-green)">
                        <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
                        <span>Agregar Categoría</span>
                    </button>
                </div>

                <div class="space-y-4">
                    <div *ngFor="let category of categories; let i = index" class="flex gap-3 items-start">
                        <div class="flex-1 grid md:grid-cols-3 gap-3">
                            <div>
                                <label class="block text-gray-700 text-sm mb-1">
                                    Nombre de Categoría
                                </label>
                                <input type="text" [(ngModel)]="category.name" [name]="'category_name_' + i"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="Ej: Vivienda" [disabled]="isLoading || success" />
                            </div>

                            <div>
                                <label class="block text-gray-700 text-sm mb-1">
                                    Presupuesto ($)
                                </label>
                                <input type="number" [(ngModel)]="category.budget" [name]="'category_budget_' + i"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                    placeholder="0.00" min="0" step="0.01" [disabled]="isLoading || success" />
                            </div>

                            <div>
                                <label class="block text-gray-700 text-sm mb-1">
                                    Color
                                </label>
                                <div class="flex gap-2">
                                    <input type="color" [(ngModel)]="category.color" [name]="'category_color_' + i"
                                        class="w-12 h-10 rounded-lg cursor-pointer" [disabled]="isLoading || success" />
                                    <div class="flex-1 rounded-lg border border-gray-300"
                                        [style.background-color]="category.color"></div>
                                </div>
                            </div>
                        </div>

                        <button *ngIf="categories.length > 1" type="button" (click)="removeCategory(category.id)"
                            [disabled]="isLoading || success"
                            class="mt-7 p-2 text-red-600 hover:bg-red-50 rounded-lg transition-colors disabled:opacity-50">
                            <lucide-icon name="trash-2" class="w-5 h-5"></lucide-icon>
                        </button>
                    </div>
                </div>

                <!-- Total -->
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-700 font-bold">Presupuesto Total:</span>
                        <span class="text-gray-900 font-bold">\${{ calculateTotal() | number:'1.2-2' }}</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-4">
                <button type="button" (click)="navigateBack()" [disabled]="isLoading || success"
                    class="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50">
                    Cancelar
                </button>
                <button type="submit" [disabled]="isLoading || success"
                    class="flex-1 px-6 py-3 text-white rounded-lg transition-all hover:opacity-90 disabled:bg-gray-400"
                    [style.background-color]="isLoading || success ? undefined : 'var(--color-primary-green)'">
                    {{ isLoading ? 'Creando...' : success ? 'Creado ✓' : 'Crear Plantilla' }}
                </button>
            </div>
        </form>
    </div>
</div>
