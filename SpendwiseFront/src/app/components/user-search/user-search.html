<app-navbar></app-navbar>
<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-3xl font-bold" style="color: var(--color-dark-blue)">Buscar Usuarios</h2>
        <a routerLink="/dashboard"
            class="flex items-center gap-2 px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg transition-all transform hover:scale-105 hover:text-blue-600 hover:border-blue-300 hover:shadow-md cursor-pointer"
            style="text-decoration: none">
            <i class="pi pi-arrow-left"></i>
            <span>Volver al Dashboard</span>
        </a>
    </div>

    <div class="card bg-white p-6 rounded-xl shadow-lg">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <p-iconField iconPosition="left" class="w-full">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="text" pInputText placeholder="Buscar por nombre de usuario..." [(ngModel)]="searchTerm"
                    class="w-full" />
            </p-iconField>
            <p-button label="Buscar" icon="pi pi-search"
                [style]="{ 'background-color': 'var(--color-primary-green)', 'border': 'none' }"></p-button>
        </div>

        <p-table [value]="users" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped">
            <ng-template pTemplate="header">
                <tr>
                    <th>Usuario</th>
                    <th>Email</th>
                    <th>Seguidores</th>
                    <th style="width: 15%">Acción</th>
                </tr>
            </ng-template>
            <ng-template pTemplate="body" let-user>
                <tr>
                    <td class="font-bold">{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.followers }}</td>
                    <td>
                        <p-button icon="pi pi-user" label="Ver Perfil" [outlined]="true" size="small"
                            [style]="{ 'color': 'var(--color-primary-blue)', 'border-color': 'var(--color-primary-blue)' }"></p-button>
                    </td>
                </tr>
            </ng-template>
        </p-table>
    </div>
</div>
