<div class="min-h-screen bg-gray-50">
    <app-navbar></app-navbar>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="mb-8 flex justify-between items-start">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Editar Plantilla</h1>
                <p class="text-gray-600">
                    Modifica tu plantilla de presupuesto existente
                </p>
            </div>
            <a routerLink="/templates"
                class="flex items-center gap-2 px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg transition-all transform hover:scale-105 hover:text-blue-600 hover:border-blue-300 hover:shadow-md cursor-pointer">
                <i class="pi pi-arrow-left"></i>
                <span>Volver a Mis Plantillas</span>
            </a>
        </div>

        <div *ngIf="error" class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg flex items-start gap-3">
            <lucide-icon name="alert-circle" class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5"></lucide-icon>
            <p class="text-red-800">{{ error }}</p>
        </div>

        <div *ngIf="success" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg flex items-start gap-3">
            <lucide-icon name="check-circle" class="w-5 h-5 text-green-600 flex-shrink-0 mt-0.5"></lucide-icon>
            <p class="text-green-800">¡Plantilla actualizada exitosamente! Redirigiendo...</p>
        </div>

        <form (ngSubmit)="handleSubmit()" class="space-y-6">
            <!-- Basic Info -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                <h2 class="text-gray-900 mb-4 font-bold text-xl flex items-center gap-2">
                    <lucide-icon name="file-text" class="w-5 h-5 text-blue-600"></lucide-icon>
                    Información Básica
                </h2>

                <div class="space-y-4">
                    <div>
                        <label htmlFor="name" class="block text-gray-700 mb-2 font-medium">
                            Nombre de la Plantilla *
                        </label>
                        <input id="name" type="text" [(ngModel)]="name" name="name"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="Ej: Presupuesto Mensual Personal" [disabled]="isLoading" required />
                    </div>

                    <div>
                        <label htmlFor="description" class="block text-gray-700 mb-2 font-medium">
                            Descripción *
                        </label>
                        <textarea id="description" [(ngModel)]="description" name="description" rows="3"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                            placeholder="Describe el propósito de esta plantilla..." [disabled]="isLoading"
                            required></textarea>
                    </div>

                    <div class="mt-4 flex items-center gap-3 p-4 bg-gray-50 rounded-lg border border-gray-100">
                        <div class="flex items-center h-5">
                            <input id="isPublic" name="isPublic" type="checkbox" [(ngModel)]="isPublic"
                                class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">
                        </div>
                        <div class="ml-2">
                            <label for="isPublic" class="font-medium text-gray-700 cursor-pointer select-none">Plantilla
                                Pública</label>
                            <p class="text-xs text-gray-500">Si se marca, otros usuarios podrán ver y usar esta
                                plantilla
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Structure -->
            <div class="bg-white rounded-xl p-6 shadow-sm border border-slate-200">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-gray-900 font-bold text-xl flex items-center gap-2">
                        <lucide-icon name="table" class="w-5 h-5 text-green-600"></lucide-icon>
                        Estructura del Presupuesto
                    </h2>
                    <button type="button" (click)="addItem()"
                        class="px-4 py-2 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition-colors font-medium flex items-center gap-2"
                        [disabled]="isLoading">
                        <lucide-icon name="plus" class="w-4 h-4"></lucide-icon>
                        Agregar Concepto
                    </button>
                </div>

                <div class="space-y-3">
                    <div *ngFor="let row of rows; let i = index"
                        class="flex flex-col md:flex-row gap-4 p-4 rounded-xl border border-gray-100 bg-gray-50/50 hover:bg-gray-50 transition-colors items-end md:items-center">

                        <div class="flex-grow w-full md:w-auto">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Nombre</label>
                            <input type="text" [(ngModel)]="row.name" [name]="'row_name_' + i"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="Ej: Sueldo, Alquiler..." required />
                        </div>

                        <div class="w-full md:w-40">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Tipo</label>
                            <select [(ngModel)]="row.transaction_kind" [name]="'row_type_' + i"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="INCOME">Ingreso</option>
                                <option value="EXPENSE">Gasto</option>
                            </select>
                        </div>

                        <div class="w-full md:w-40">
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Monto Estimado</label>
                            <input type="text" [value]="row.amount" [name]="'row_amount_' + i"
                                (input)="validateNumberInput($event, i)"
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                                placeholder="0.00" required />
                        </div>

                        <button type="button" (click)="removeItem(i)"
                            class="h-10 w-10 flex items-center justify-center text-red-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors"
                            [disabled]="rows.length <= 1" title="Eliminar fila">
                            <lucide-icon name="trash-2" class="w-5 h-5"></lucide-icon>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="submit"
                    class="flex-1 px-8 py-4 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all font-bold shadow-lg shadow-blue-200 transform hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed"
                    [disabled]="isLoading || !name || !description">
                    {{ isLoading ? 'Guardando...' : 'Guardar Cambios' }}
                </button>
                <button type="button" (click)="navigateBack()"
                    class="px-8 py-4 border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 transition-colors font-medium">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
