<div class="container mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold mb-6" style="color: var(--color-dark-blue)">Buscar Plantillas</h2>

    <div class="card bg-white p-6 rounded-xl shadow-lg">
        <div class="flex flex-col md:flex-row gap-4 mb-6">
            <p-iconField iconPosition="left" class="w-full">
                <p-inputIcon styleClass="pi pi-search" />
                <input type="text" pInputText placeholder="Buscar plantillas..." [(ngModel)]="searchTerm"
                    class="w-full" />
            </p-iconField>
            <p-button label="Buscar" icon="pi pi-search"
                [style]="{ 'background-color': 'var(--color-primary-green)', 'border': 'none' }"></p-button>
        </div>

        <p-dataview [value]="templates" [layout]="'grid'" [paginator]="true" [rows]="6">
            <ng-template pTemplate="grid" let-templates>
                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-12 sm:col-span-6 lg:col-span-4 p-2" *ngFor="let template of templates">
                        <div
                            class="p-4 border-1 surface-border surface-card border-round rounded-lg border border-gray-200 hover:shadow-md transition-shadow">
                            <div class="flex flex-col align-items-center gap-3 py-5">
                                <div class="text-2xl font-bold flex align-items-center gap-2"
                                    style="color: var(--color-dark-blue)">
                                    <i class="pi pi-file"></i>
                                    {{ template.name }}
                                </div>
                                <div class="flex align-items-center gap-2 mt-2">
                                    <span class="font-semibold text-gray-600">Por: {{ template.author }}</span>
                                </div>
                                <div class="flex align-items-center gap-2 mt-3">
                                    <p-tag [value]="template.category"
                                        [severity]="getSeverity(template.category)"></p-tag>
                                    <span class="flex align-items-center gap-1 ml-4 text-yellow-500 font-bold">
                                        <i class="pi pi-star-fill"></i> {{ template.rating }}
                                    </span>
                                </div>
                            </div>
                            <div
                                class="flex align-items-center justify-content-between justify-between mt-3 pt-3 border-t border-gray-100">
                                <span class="text-xl font-bold text-gray-800">{{ template.price === 0 ? 'Gratis' : '$' +
                                    template.price }}</span>
                                <p-button icon="pi pi-download" label="Ver Detalles" size="small"
                                    [style]="{ 'background-color': 'var(--color-primary-blue)', 'border': 'none' }"></p-button>
                            </div>
                        </div>
                    </div>
                </div>
            </ng-template>
        </p-dataview>
    </div>
</div>
