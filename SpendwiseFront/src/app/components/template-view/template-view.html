<div class="min-h-screen bg-gray-50">
    <app-navbar></app-navbar>

    <div class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Header -->
        <div class="mb-8">
            <button pButton label="Volver a Plantillas" icon="pi pi-arrow-left" class="p-button-text mb-4"
                [routerLink]="['/templates']"></button>

            <p-card *ngIf="template" styleClass="shadow-sm">
                <div class="flex flex-col md:flex-row md:items-start justify-between gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 mb-2">{{ template.name }}</h1>
                        <p class="text-gray-600 mb-4">{{ template.description }}</p>
                        <div class="flex items-center gap-4 text-sm text-gray-500">
                            <span class="flex items-center gap-1">
                                <i class="pi pi-calendar"></i>
                                Creado el {{ template.createdAt | date:'mediumDate' }}
                            </span>
                            <p-tag [value]="template.isPublic ? 'Pública' : 'Privada'"
                                [severity]="template.isPublic ? 'success' : 'secondary'"></p-tag>
                        </div>
                    </div>
                </div>
            </p-card>
        </div>

        <!-- Loading State -->
        <!--         <div *ngIf="isLoading" class="flex justify-center py-12">
            <p-progressSpinner ariaLabel="loading"></p-progressSpinner>
        </div> -->

        <!-- Error State -->
        <div *ngIf="error" class="bg-red-50 text-red-700 p-4 rounded-lg mb-8 border border-red-200">
            <div class="flex items-center gap-2">
                <i class="pi pi-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
        </div>

    </div>
</div>
